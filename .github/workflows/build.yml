name: Build ReLCS-Cleo.asi

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ASI Plugin
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Release Win32
        shell: pwsh
        run: |
          msbuild ReLCS-Cleo.sln `
            /m `
            /p:Configuration=Release `
            /p:Platform=Win32 `
            /p:OutDir="${{ github.workspace }}\build\\" `
            /p:TargetName=ReLCS-Cleo `
            /p:TargetExt=.asi `
            /fileLogger /fileLoggerParameters:LogFile=msbuild.log;Verbosity=normal

          if (-not (Test-Path "${{ github.workspace }}\build\ReLCS-Cleo.asi")) {
            Get-Content msbuild.log | Select-String "error " | ForEach-Object { Write-Output "::error::$($_)" }
            throw "Build failed: ReLCS-Cleo.asi was not generated."
          }

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: msbuild-log
          path: msbuild.log

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReLCS-Cleo-asi
          path: build/ReLCS-Cleo.asi
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/ReLCS-Cleo.asi
          generate_release_notes: true
